name: Update Google reviews

on:
  schedule:
    - cron: "17 4 * * *" # daily, 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: update-reviews
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch rating + review count from Google Places and apply to the site
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          GOOGLE_PLACE_ID: ${{ vars.GOOGLE_PLACE_ID }}
        run: node scripts/update-reviews.mjs

      - name: Commit and push if anything changed
        id: commit
        run: |
          if git diff --quiet; then
            echo "No change."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: sync Google rating and review count"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Request GitHub Pages rebuild
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
