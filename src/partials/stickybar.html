<div class="stickybar" role="group" aria-label="{{t.bar.label}}" data-i18n-attr="aria-label:bar.label">
  <a class="stickybar__btn" href="{{site.phoneHref}}">
    <svg class="ic" aria-hidden="true"><use href="#i-phone"/></svg>
    <span data-i18n="cta.call">{{{t.cta.call}}}</span>
  </a>
  <a class="stickybar__btn stickybar__btn--wa" href="{{waHref}}" target="_blank" rel="noopener">
    <svg class="ic" aria-hidden="true"><use href="#i-whatsapp"/></svg>
    <span data-i18n="cta.whatsapp">{{{t.cta.whatsapp}}}</span>
  </a>
  <a class="stickybar__btn stickybar__btn--primary" href="/#preise">
    <svg class="ic" aria-hidden="true"><use href="#i-tag"/></svg>
    <span data-i18n="nav.prices">{{{t.nav.prices}}}</span>
  </a>
</div>
